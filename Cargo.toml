[package]
name = "banana"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/requla11/banana"
description = "Universal P2P artifact cache mesh, zero-daemon OCI container builder, SLSA supply-chain cryptographic ledger, and polyglot AST engine in Rust"
keywords = ["p2p", "oci", "container", "slsa", "ast"]
categories = ["development-tools", "command-line-utilities", "virtualization"]

[dependencies]
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
tokio = { version = "1.43", features = ["full"] }
blake3 = "1.6"
chrono = { version = "0.4", features = ["serde"] }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.8"
flate2 = "1.0"
tar = "0.4"
regex = "1.11"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3.17"
